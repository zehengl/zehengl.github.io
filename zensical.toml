[project]
site_name = "zehengl.github.io"
site_author = "Zeheng Li"
repo_name = "zehengl.github.io"
repo_url = "https://github.com/zehengl/zehengl.github.io"
copyright = "Copyright &copy; 2018 - 2026 Zeheng Li"
nav = ["index.md", "uses.md"]
extra_javascript = [
  "javascripts/katex.js",
  "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js",
]
extra_css = [
  "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css",
]
plugins = [
  "search",
  "tags",
  { blog = { blog_dir = ".", post_url_format = "{slug}" } },
  { minify = { minify_html = true, minify_js = true, js_files = [
    "javascripts/katex.js",
  ] } },
  { "git-revision-date-localized" = { type = "timeago", enable_creation_date = true } },
]

[project.theme]
variant = "classic"
favicon = "https://raw.githubusercontent.com/zehengl/logo/main/ZL.png"
logo = "https://raw.githubusercontent.com/zehengl/logo/main/ZL.png"
font.text = "Roboto"
features = ["header.autohide", "navigation.top"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "grey"
accent = "green"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/zehengl"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/zehengl"

[project.extra.analytics]
provider = "google"
property = "G-9CCVXS7XGY"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tilde = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
